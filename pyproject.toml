[project]
name = "my_qq_bot"
version = "0.1.0"
description = "my_qq_bot"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "lunar-python>=1.4.8",
    "bilibili-api-python>=17.4.2",
    "httpx>=0.28",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 只收 tests/。必须显式钉死：2026-10-15 把同担交接包放进 assets/handoff/ 之后，
# 它自带的 40 多个测试文件被一起收集，整个 pytest 直接 25 errors 中断。
# 那些是**另一个项目**的测试（依赖它自己的包结构与未装的依赖），本仓不跑、也不该跑。
testpaths = ["tests"]
norecursedirs = ["assets", "outputs", "video", "env", ".venv", "napcat", "node_modules"]

[tool.nonebot]
plugin_dirs = ["src/plugins"]
plugins = ["nonebot_plugin_gocqhttp"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
